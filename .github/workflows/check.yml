name: Check

# Does a pull request typecheck, pass its logic tests and build?
#
# Netlify builds every pull request too, but a red deploy preview is easy to
# merge past, and has been: a page that rendered fine in development could not
# be prerendered, the preview failed, and it was merged anyway. This says the
# same thing where the merge button is.
#
# The browser tests (tests/e2e) are not run here. They drive the real shop and
# leave carts behind, so they are run by hand before a deploy: `pnpm test:e2e`.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # package.json has no packageManager field, and the action refuses to
          # guess. Kept in step with the version the project builds on.
          version: 10.27.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:unit

      # Prerendering fetches from Sanity and Shopify, as it does on Netlify
      - name: Build
        env:
          NEXT_PUBLIC_WEGLOT_API_KEY: ${{ secrets.NEXT_PUBLIC_WEGLOT_API_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
        run: pnpm build

name: Refresh translations

# English text is compiled into the site, so a correction made in the Weglot
# dashboard only reaches visitors once messages/en.json is regenerated and
# deployed. Netlify builds on push to main, so committing the file is the
# deploy.
#
# Triggered, not scheduled. GitHub's cron never fired for this workflow — an
# afternoon of runs, all manual, none scheduled — and its docs allow five
# minutes at best while warning that runs are delayed or dropped under load.
# netlify/functions/weglot-watch.mts dispatches this every ten minutes, and the
# Actions tab has a Run workflow button for when that is too slow.
#
# It fetches and compares every time, because Weglot has no signal that moves
# when a translation is edited: versions.translation, the only version field it
# exposes, stayed put while two corrections sat in its memory.

on:
  workflow_dispatch:

concurrency:
  group: refresh-translations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          # package.json has no packageManager field, and the action refuses to
          # guess. Kept in step with the version the project builds on.
          version: 10.27.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pull corrections from Weglot
        env:
          NEXT_PUBLIC_WEGLOT_API_KEY: ${{ secrets.NEXT_PUBLIC_WEGLOT_API_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
        run: pnpm translate:refresh

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/

          # The diff is the change detection: Weglot exposes no signal that moves
          # when a translation is edited, so the only way to know is to fetch and
          # compare.
          if git diff --cached --quiet; then
            echo "Weglot moved but nothing we render changed."
            exit 0
          fi
          git commit -m "Refresh translations from Weglot

          Automated: picks up corrections made in the Weglot dashboard so they
          reach the site without a manual run. See
          .github/workflows/refresh-translations.yml"
          git push
